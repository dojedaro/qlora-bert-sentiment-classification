[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qlora-bert"
version = "0.2.0"
description = "QLoRA vs. full fine-tuning of BERT for sentiment classification, measured on the same GPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
# Training needs a CUDA GPU: bitsandbytes 4-bit kernels are GPU-only.
gpu = [
    "torch>=2.3",
    "transformers>=4.46",
    "datasets>=2.19",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=0.34",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
